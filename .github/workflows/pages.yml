name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Set up Rust (wasm32)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - name: Compile engines
        run: cargo build --manifest-path src/browser/rust/Cargo.toml --workspace --release --target wasm32-unknown-unknown
      - name: Build launcher
        run: |
          npm --prefix src/browser/frontend/launcher ci
          npm --prefix src/browser/frontend/launcher run build
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r src/browser/frontend/launcher/dist/* _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
